name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-c:
    name: C11 Cryptographic Engine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake valgrind

      - name: Compile C Core & Run Unit Tests (${{ matrix.compiler }})
        env:
          CC: ${{ matrix.compiler }}
        run: |
          cd core-c
          make clean
          make all
          make test

      - name: Run AddressSanitizer & UndefinedBehaviorSanitizer
        env:
          CC: ${{ matrix.compiler }}
        run: |
          cd core-c
          make asan

      - name: Run Microbenchmarks
        env:
          CC: ${{ matrix.compiler }}
        run: |
          cd core-c
          make bench

  contracts:
    name: Solidity Foundry Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Check Formatting
        run: |
          cd contracts
          forge fmt --check

      - name: Compile Smart Contracts
        run: |
          cd contracts
          forge build --sizes

      - name: Run Test Suite & Fuzz Tests
        run: |
          cd contracts
          forge test -vvv --gas-report

  web-client:
    name: Web Dashboard & Vercel Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Typecheck and Build Web Client
        run: |
          cd apps/web
          npm run build
