name: "🐛 Bug Report"
description: File a bug report for Aegis C engine, Solidity contracts, or Web explorer
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in Aegis ZK Accumulator.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "core-c (C11 cryptographic library & precompile)"
        - "contracts (Solidity & Yul verification)"
        - "apps/web (Web Explorer & UI)"
        - "ci/cd (Workflows & Pipelines)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide commands (e.g. `forge test`, `./build/aegis-cli`, or calldata).
      placeholder: |
        1. Run `forge test --match-test test_X`
        2. Observed unexpected revert or gas surge
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, compiler (gcc/clang/solc), foundry version.
